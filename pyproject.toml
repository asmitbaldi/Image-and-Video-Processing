[project]
name = "codes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Asmit Baldi", email = "asmitbaldi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
]

[project.scripts]
codes = "codes:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
